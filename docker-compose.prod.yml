# Production stack for aiaas.kaushaljain.com. Live on a GCP e2-medium (4 GB RAM,
# shared with NGU) since 2026-10-01, where TLS is a shared edge-caddy and the
# `caddy` service below is left out (DEPLOYMENT.md §3). Memory tuned for that VM.
#
# THIS is the production compose file. It replaced docker-compose.ec2.yml
# (SQLite, Celery, an older host; deleted 2026-09-19) and differed from it in
# three ways:
#  - images are PULLED from Docker Hub (kaushaljainai/aiaas-*:latest), built
#    and pushed from a dev machine; nothing is built on this box (2026-09-04).
#  - nothing but caddy publishes a host port. redis/backend used to bind
#    0.0.0.0; on a box with a public IP that is an exposed service, and the
#    frontend reaches the backend over the compose network anyway.
#  - caddy terminates TLS for aiaas.kaushaljain.com (DNS points straight at this
#    box, no proxy in front) and fronts the nginx frontend.

services:
  redis:
    image: redis:7-alpine
    container_name: aiaas-redis
    restart: unless-stopped
    # 96 -> 64 MB: this box holds channels traffic + cache only, and the data
    # cap is what stops a burst from eating the host. mem_limit is the RSS
    # ceiling on top (fragmentation + fork-for-save needs headroom over data).
    command: redis-server --save 60 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data
    networks:
      - aiaas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL — restored from the 2026-08-28 snapshot of the previous box.
  # Tuned small on purpose: the 913 MB box held ~220 MB for the backend alone,
  # so the defaults (shared_buffers=128MB and max_connections=100) would have
  # left nothing for the app. Kept as-is on the 2 GB box: still ample for
  # this workload, and the memory below is spoken for.
  # 2026-09-03 tightening: max_connections 60 -> 25 (one Daphne process with
  # a pool capped at DB_POOL_MAX_SIZE never holds more than that; each backend is ~5-10
  # MB, so 60 was ~350 MB of worst case for nothing), shared_buffers 64 -> 40
  # MB (24 MB back to the OS, still ample for this workload), and
  # maintenance_work_mem 48 -> 16 MB (only spent during VACUUM/CREATE INDEX).
  db:
    image: postgres:16-alpine
    container_name: aiaas-db
    restart: unless-stopped
    env_file:
      - .env
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
      -c wal_compression=on
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    # 2026-10-01, 4 GB VM: the 69 MB database fits in shared_buffers, so
    # reads stop going to disk; 40 connections = app pool 16 + headroom for
    # psql, migrations and pg_dump. SSD disk, hence random_page_cost 1.1.
    mem_limit: 512m
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aiaas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox:
    # Pulled from Hub — nothing is built on this box (2026-09-04).
    image: kaushaljainai/aiaas-sandbox:latest
    container_name: aiaas-sandbox
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 600m on the 2 GB box (2026-09-24, Phase 5 option 2): two slots at a
    # SANDBOX_MEM_MB=256 per-run rlimit is ~512 MB of children plus the
    # runtime, so the container they share gets room for both. A burst beyond
    # two slots gets a 503 the backend surfaces as a retryable "sandbox is
    # busy" tool error, not more subprocesses than the box holds.
    mem_limit: 600m
    pids_limit: 128
    environment:
      SANDBOX_MAX_CONCURRENCY: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sandbox-net

  backend:
    # Pulled from Hub — nothing is built on this box (2026-09-04).
    image: kaushaljainai/aiaas-backend:latest
    container_name: aiaas-backend
    restart: unless-stopped
    # Uncapped before: one leak could take the whole box. Daphne is a
    # single process sitting at ~100-220 MB, so 384m caps the worst case
    # without touching steady state.
    # 384m -> 768m (2026-10-01, 4 GB VM): daphne idled at 220 MB, 57% of
    # the old cap, so one large office render or long transcript was an
    # OOM kill away from a 502 for everyone.
    mem_limit: 768m
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      # The embedder is a remote-API client (inference/engine.py), so skipping
      # the boot preload only defers building a light object to first use.
      PRELOAD_EMBEDDER: "False"
      PUBLIC_URL: https://aiaas.kaushaljain.com
      ALLOWED_HOSTS: "aiaas.kaushaljain.com,34.0.5.162,localhost,127.0.0.1,backend"
      CSRF_TRUSTED_ORIGINS: "https://aiaas.kaushaljain.com"
      CORS_ALLOWED_ORIGINS: "https://aiaas.kaushaljain.com"
      # CORS_ALLOW_ALL_ORIGINS was "True" here, which overrides the allow-list
      # above and, with credentials on, echoes any site's Origin back (S5).
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_REDIS_CHANNEL_LAYER: "True"
      RUN_WORKFLOWS_ASYNC: "False"
      # DB_ENGINE / DATABASE_URL come from .env (postgres on the db service).
      # Do NOT pin them here: compose `environment:` beats `env_file:`, which is
      # how this stack silently stayed on SQLite after the restore.
      GOOGLE_OAUTH_REDIRECT_URI: https://aiaas.kaushaljain.com/auth/google/callback
      USE_S3: "False"
      SANDBOX_ENGINE: "service"
      SANDBOX_SERVICE_URL: http://sandbox:8100
      # 256 per run under the sidecar's 600m/two-slot budget on the 2 GB box
      # (2026-09-24, Phase 5 option 2). A run needing more fails loudly with
      # an out-of-memory error rather than pushing the box into swap.
      SANDBOX_MEM_MB: "256"
      # No local-process MCP servers (2026-09-17). Google connectors are native
      # REST tools and the image carries no Node; this is set explicitly as
      # well as defaulted in settings/deployment.py so the compose file says it.
      # The supervisor vars below it were retired with the stdio connectors —
      # they only ever bounded processes this deployment can no longer start.
      MCP_ALLOW_STDIO: "False"
      # Pooled (settings/base.py::_postgres_connection, 2026-09-17). The old
      # DB_CONN_MAX_AGE=0 stopped Daphne's threads each holding a connection,
      # which exhausted Postgres here, but it also meant every request connected
      # and authenticated from scratch. The pool keeps a few open and caps the
      # process hard at DB_POOL_MAX_SIZE, which must stay under the db service's
      # max_connections=40 with room for psql and migrations. Each Postgres
      # backend is ~5-10 MB of the db container's 512m.
      DB_POOL: "True"
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "16"
      # Run state lives in Postgres (live since 2026-10-01). SQLite serialised
      # every run's checkpoint writes behind one lock. Needs a backend image
      # from 2026-10-01 or later: before it, the saver never opened its pool
      # (every turn failed with PoolClosed), never created its tables, and
      # held a process-wide lock anyway (chat/turn/checkpoints.py::
      # _pooled_saver_class). Connection sum: app pool 16 + checkpointer 4,
      # under max_connections=40. No AGENT_CHECKPOINT_DSN: it falls back to
      # DATABASE_URL, then to Django's own default database.
      AGENT_CHECKPOINTER: "postgres"
      AGENT_CHECKPOINT_POOL_MAX: "4"
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    networks:
      - aiaas-network
      - sandbox-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    # Pulled from Hub — nothing is built on this box (2026-09-04).
    image: kaushaljainai/aiaas-frontend:latest
    container_name: aiaas-frontend
    restart: unless-stopped
    # nginx sits at ~2 MB; the cap is purely a backstop.
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aiaas-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: aiaas-caddy
    restart: unless-stopped
    # Caddy access logs are the chattiest stream on this box; rotation matters
    # here more than anywhere (unbounded json-file + 8 GB disk = outage).
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - aiaas-network

networks:
  aiaas-network:
    driver: bridge
  sandbox-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  backend_data:
  backend_media:
  redis_data:
  caddy_data:
  caddy_config:
