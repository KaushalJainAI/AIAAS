<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">One agent run = a loop of four steps</text>

  <!-- agent -->
  <rect x="245" y="50" width="190" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="340" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#3b0764">agent</text>
  <text x="340" y="96" text-anchor="middle" font-size="11.5" fill="#5b21b6">model thinks, picks tools</text>

  <!-- tools -->
  <rect x="455" y="180" width="200" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="555" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#0c4a6e">tools</text>
  <text x="555" y="226" text-anchor="middle" font-size="11.5" fill="#075985">approve → run → record</text>

  <!-- curate -->
  <rect x="245" y="310" width="190" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="340" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">curate</text>
  <text x="340" y="356" text-anchor="middle" font-size="11.5" fill="#92400e">fold old results at 70% full</text>

  <!-- steering -->
  <rect x="25" y="180" width="200" height="62" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="125" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">steering</text>
  <text x="125" y="226" text-anchor="middle" font-size="11.5" fill="#166534">deliver queued user messages</text>

  <!-- END -->
  <rect x="520" y="46" width="140" height="44" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="590" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">END: answer</text>

  <!-- edges -->
  <path d="M435,95 Q520,120 540,176" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="505" y="135" font-size="11.5" fill="#334155">tool calls</text>
  <path d="M540,242 Q520,310 439,335" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M245,335 Q160,310 140,246" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M140,180 Q160,110 241,90" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="435" y1="66" x2="516" y2="66" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="443" y="58" font-size="11" fill="#334155">no tool calls</text>

  <text x="340" y="200" text-anchor="middle" font-size="12.5" fill="#475569">STEPS_PER_ITERATION = 4</text>
  <text x="340" y="220" text-anchor="middle" font-size="11.5" fill="#64748b">steer lands after tool results,</text>
  <text x="340" y="236" text-anchor="middle" font-size="11.5" fill="#64748b">before the model reads them</text>

  <text x="340" y="402" text-anchor="middle" font-size="11.5" fill="#64748b">Each step can be checkpointed · a pause (approval) resumes at the same step</text>
</svg>
