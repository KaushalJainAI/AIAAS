<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">AgentToolbox.dispatch — every call walks the same gates</text>

  <rect x="200" y="48" width="320" height="38" rx="19" fill="#f1f5f9" stroke="#475569"/>
  <text x="360" y="72" text-anchor="middle" font-size="13" fill="#1e293b">model asks: run tool X with args</text>
  <line x1="360" y1="86" x2="360" y2="100" stroke="#334155" stroke-width="1.6" marker-end="url(#d)"/>

  <!-- gates: narrowing funnel -->
  <rect x="100" y="102" width="520" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="360" y="127" text-anchor="middle" font-size="13" fill="#0c4a6e">1 · MCP tool? needs the mcp grant + connection scope</text>
  <rect x="120" y="152" width="480" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="360" y="177" text-anchor="middle" font-size="13" fill="#0c4a6e">2 · code tool? needs the codeExecution grant</text>
  <rect x="140" y="202" width="440" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="360" y="227" text-anchor="middle" font-size="13" fill="#0c4a6e">3 · per-tool permission is "deny"?</text>
  <rect x="160" y="252" width="400" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="360" y="277" text-anchor="middle" font-size="13" fill="#0c4a6e">4 · in allowed_names (grants ∩ toolScope)?</text>
  <rect x="180" y="302" width="360" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="360" y="327" text-anchor="middle" font-size="13" fill="#0c4a6e">5 · native connector live and in scope?</text>
  <rect x="200" y="352" width="320" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="360" y="377" text-anchor="middle" font-size="13" fill="#3b0764">6 · inside an eval world? simulate</text>
  <line x1="360" y1="392" x2="360" y2="406" stroke="#334155" stroke-width="1.6" marker-end="url(#d)"/>
  <rect x="220" y="410" width="280" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="360" y="437" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">execute_tool — the real call</text>

  <!-- refusals -->
  <line x1="620" y1="122" x2="660" y2="122" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="172" x2="660" y2="172" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="222" x2="660" y2="222" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="272" x2="660" y2="272" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="322" x2="660" y2="322" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="664" y="100" width="140" height="244" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="734" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">refused</text>
  <text x="734" y="220" text-anchor="middle" font-size="11.5" fill="#991b1b">returned as text</text>
  <text x="734" y="236" text-anchor="middle" font-size="11.5" fill="#991b1b">naming the real reason,</text>
  <text x="734" y="252" text-anchor="middle" font-size="11.5" fill="#991b1b">so the model stops</text>
  <text x="734" y="268" text-anchor="middle" font-size="11.5" fill="#991b1b">retrying</text>

  <line x1="520" y1="372" x2="660" y2="372" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#d)"/>
  <rect x="664" y="354" width="140" height="38" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="734" y="378" text-anchor="middle" font-size="12" fill="#3b0764">simulator (fixtures)</text>

  <text x="410" y="485" text-anchor="middle" font-size="12" fill="#475569">The offer (descriptors) filters the same way — a model can still name a tool it saw earlier, so dispatch re-checks.</text>
</svg>
