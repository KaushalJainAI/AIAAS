<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">AIAAS — high-level design</text>

  <!-- Browser -->
  <rect x="20" y="160" width="150" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="95" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#0c4a6e">Browser</text>
  <text x="95" y="226" text-anchor="middle" font-size="12" fill="#0c4a6e">React + Vite</text>
  <text x="95" y="244" text-anchor="middle" font-size="12" fill="#0c4a6e">React Query, reducers</text>

  <!-- Django container -->
  <rect x="215" y="60" width="200" height="330" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="315" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Django ASGI (daphne)</text>
  <rect x="232" y="100" width="166" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="315" y="127" text-anchor="middle" font-size="13" fill="#1e293b">REST views (DRF)</text>
  <rect x="232" y="154" width="166" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="315" y="181" text-anchor="middle" font-size="13" fill="#1e293b">SSE turn stream</text>
  <rect x="232" y="208" width="166" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="315" y="235" text-anchor="middle" font-size="13" fill="#1e293b">WebSocket consumers</text>
  <rect x="232" y="262" width="166" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="315" y="285" text-anchor="middle" font-size="13" fill="#1e293b">Scheduler loop</text>
  <text x="315" y="303" text-anchor="middle" font-size="11" fill="#64748b">one leader via DB lease</text>
  <text x="315" y="352" text-anchor="middle" font-size="11" fill="#64748b">middleware: sanitise,</text>
  <text x="315" y="368" text-anchor="middle" font-size="11" fill="#64748b">rate-limit, log</text>

  <!-- Engine container -->
  <rect x="455" y="60" width="210" height="330" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#3b0764">Agent engine</text>
  <rect x="472" y="100" width="176" height="54" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="560" y="123" text-anchor="middle" font-size="13" fill="#3b0764">LangGraph loop</text>
  <text x="560" y="141" text-anchor="middle" font-size="11" fill="#6d28d9">agent → tools → curate → steer</text>
  <rect x="472" y="164" width="176" height="54" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="560" y="187" text-anchor="middle" font-size="13" fill="#3b0764">Tool registry</text>
  <text x="560" y="205" text-anchor="middle" font-size="11" fill="#6d28d9">grants · scopes · approvals</text>
  <rect x="472" y="228" width="176" height="54" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="560" y="251" text-anchor="middle" font-size="13" fill="#3b0764">llm/access funnel</text>
  <text x="560" y="269" text-anchor="middle" font-size="11" fill="#6d28d9">keys · clamp · effort · retry</text>
  <rect x="472" y="292" width="176" height="54" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="560" y="315" text-anchor="middle" font-size="13" fill="#3b0764">Virtual filesystem</text>
  <text x="560" y="333" text-anchor="middle" font-size="11" fill="#6d28d9">rows, never host files</text>

  <!-- Outside -->
  <rect x="705" y="80" width="195" height="48" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="802" y="100" text-anchor="middle" font-size="13" fill="#78350f">LLM providers</text>
  <text x="802" y="117" text-anchor="middle" font-size="11" fill="#92400e">OpenRouter · OpenAI · NVIDIA …</text>
  <rect x="705" y="140" width="195" height="48" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="802" y="160" text-anchor="middle" font-size="13" fill="#7f1d1d">Sandbox sidecar</text>
  <text x="802" y="177" text-anchor="middle" font-size="11" fill="#991b1b">no network · no secrets</text>
  <rect x="705" y="200" width="195" height="48" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="802" y="220" text-anchor="middle" font-size="13" fill="#78350f">Gmail · Drive · MCP</text>
  <text x="802" y="237" text-anchor="middle" font-size="11" fill="#92400e">user's own credentials</text>
  <rect x="705" y="266" width="195" height="48" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="802" y="286" text-anchor="middle" font-size="13" fill="#14532d">PostgreSQL</text>
  <text x="802" y="303" text-anchor="middle" font-size="11" fill="#166534">rows + run checkpoints</text>
  <rect x="705" y="326" width="195" height="44" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="802" y="346" text-anchor="middle" font-size="13" fill="#14532d">Redis</text>
  <text x="802" y="362" text-anchor="middle" font-size="11" fill="#166534">channels · tool cache</text>

  <!-- arrows -->
  <line x1="170" y1="190" x2="228" y2="176" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="150" y="150" font-size="11" fill="#475569">HTTP + SSE</text>
  <line x1="170" y1="240" x2="228" y2="232" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="176" y="258" font-size="11" fill="#475569">WebSocket</text>
  <line x1="415" y1="176" x2="468" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="415" y1="288" x2="468" y2="140" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M648,255 L684,255 L684,104 L701,104" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="648" y1="190" x2="701" y2="165" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="648" y1="200" x2="701" y2="224" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="648" y1="318" x2="701" y2="290" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M315,390 L315,402 L802,402 L802,374" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <text x="460" y="428" text-anchor="middle" font-size="12" fill="#475569">One 913 MB box · modular monolith · one web process · sandbox in its own container</text>
</svg>
