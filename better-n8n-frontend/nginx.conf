server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression is Caddy's job (Caddyfile: encode zstd gzip). Caddy will not
    # re-encode a response that is already compressed, so gzipping here meant
    # production served gzip even to browsers that asked for zstd. A stack with
    # no Caddy in front (docker-compose.yml) serves these uncompressed.
    gzip off;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Chat turns are long-lived POST SSE streams: disable buffering/gzip so
    # frames pass straight through, and raise the read timeout past the
    # longest turn (backend sends X-Accel-Buffering: no, honoured here).
    location /api/ {
        # nginx's default is 1 MB, which refused every upload over 1 MB with a
        # 413 while the backend allows 50 MB (MAX_DOCUMENT_SIZE). Just above
        # that, so the backend's own limit is the one users meet (N5).
        client_max_body_size 55m;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        gzip off;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # Hashed build artifacts (Vite emits filenames like assets/index-abc123.js).
    # The hash changes every deploy, so we can cache aggressively forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The pdf.js worker is emitted as a hashed .mjs file. A module worker only
    # starts when served with a JavaScript type, and nginx's stock mime.types
    # has not always mapped .mjs; without this every PDF fails to open.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # pdf.js run-time data (fonts, character maps, image decoders; see
    # pdfjsAssets in vite.config.ts). Not hashed, so cached for a week rather
    # than for ever, and a missing file is a 404, never the SPA's index.html.
    location /pdfjs/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA entry: index.html must NOT be cached, otherwise returning users
    # get stale HTML that still references old hashed bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        # SPA fallback — also bypass caching of the HTML response.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
