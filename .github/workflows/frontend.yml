name: frontend

# Moved from `better-n8n-frontend/.github/` to the repo root: GitHub only reads
# workflows from here, so it had not run since the repos were merged on
# 2026-09-27.

on:
  push:
    branches: [main, develop]
    paths:
      - "better-n8n-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "better-n8n-frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: better-n8n-frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: better-n8n-frontend/package-lock.json

      - run: npm ci

      # `tsc -b --force`, not `tsc --noEmit`: the root tsconfig only holds
      # project references, so a plain noEmit run checks zero files.
      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Real pages against a mocked network (MSW + jsdom). Not in CI before,
      # which is how it sat unrunnable (no jsdom installed) and then stale (a
      # deleted page, fixtures for routes that no longer exist) unnoticed.
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npx vite build
